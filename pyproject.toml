[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darkmatter-claude-code"
version = "0.1.0"
description = "Auto-capture every Claude Code action as a verifiable Context Passport record. Hooks into Claude Code's lifecycle and emits one signed, chained passport per tool use, user prompt, and assistant turn."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "DarkMatter" }]
requires-python = ">=3.9"
keywords = ["claude-code", "ai", "agents", "audit", "verification", "provenance", "context-passport", "darkmatter"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "context-passport>=1.0.0a1",
]

[project.optional-dependencies]
signing = ["cryptography>=42.0"]
dev     = ["pytest>=7.0", "cryptography>=42.0"]

[project.scripts]
darkmatter-claude-code = "darkmatter_claude_code.cli:main"

[project.urls]
Homepage      = "https://darkmatterhub.ai"
Repository    = "https://github.com/darkmatter-hub/claude-code"
Issues        = "https://github.com/darkmatter-hub/claude-code/issues"
Specification = "https://github.com/contextpassport/spec"

[tool.setuptools.packages.find]
where = ["src"]
